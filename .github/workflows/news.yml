{
  "name": "Update news",
  "on": {
    "schedule": [
      { "cron": "*/5 * * * *" }
    ],
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "update-news",
    "cancel-in-progress": false
  },
  "jobs": {
    "update": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 5,
      "steps": [
        { "uses": "actions/checkout@v4" },
        {
          "uses": "actions/setup-python@v5",
          "with": { "python-version": "3.12" }
        },
        { "run": "python fetch_news.py" },
        {
          "name": "Commit news.json",
          "run": "git config user.name \"rail-news-bot\"\ngit config user.email \"bot@users.noreply.github.com\"\ngit add news.json archive\ngit diff --cached --quiet || (git commit -m \"Update news\" && git pull --rebase && git push)\n"
        }
      ]
    }
  }
}
